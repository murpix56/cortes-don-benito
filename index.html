<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cortes de calle · Policía Local de Don Benito</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cortes de calle y afecciones al tráfico en Don Benito. Policía Local.">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cortes DB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="landing">
<div id="app">
  <header id="topbar" class="topbar"></header>
  <div class="main">
    <div id="map"></div>
    <aside id="panel" class="panel" aria-live="polite">
      <button id="grab" class="grab" aria-label="Mostrar u ocultar panel"><i></i></button>
      <div id="panelBody" class="pbody"></div>
    </aside>
  </div>
</div>

<div id="landing" class="landing"></div>
<div id="login" class="modal" hidden></div>
<div id="menu" class="menu" hidden></div>
<section id="report"></section>
<div id="toast" role="status"></div>
<input type="file" id="fileGeo" accept=".geojson,.json,application/geo+json,application/json" hidden>
<input type="file" id="fileTabla" accept=".xlsx,.xlsm,.csv,.txt,text/csv" hidden>

<script src="config.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
