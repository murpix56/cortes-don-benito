<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cortes de calle · Don Benito</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cortes DB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="row1">
      <h1>Cortes de calle <span>Don Benito</span></h1>
      <span class="netchip" id="netchip" title="Estado del callejero"></span>
      <button id="btnMenu" class="iconbtn" aria-label="Menú" aria-haspopup="true">⋯</button>
    </div>
    <div class="row2">
      <input type="datetime-local" id="when" aria-label="Fecha y hora a consultar">
      <button id="btnNow" class="chipbtn">Ahora</button>
      <select id="scope" aria-label="Qué cortes mostrar">
        <option value="instante">En ese instante</option>
        <option value="dia">Todo ese día</option>
        <option value="todos">Todos los cortes</option>
      </select>
    </div>
  </header>
  <div class="main">
    <div id="map"></div>
    <aside id="panel" class="panel" aria-live="polite">
      <button id="grab" class="grab" aria-label="Mostrar u ocultar panel"><i></i></button>
      <div id="panelBody" class="pbody"></div>
    </aside>
  </div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="fileImport" accept=".geojson,.json,application/geo+json,application/json" hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
